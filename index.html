<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Generatore Schede Libro</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#7c3aed">
  <link rel="stylesheet" href="style.css" />
  <meta name="theme-color" content="#f5e9d8">
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(() => console.log("Service Worker registrato con successo!"))
          .catch((err) => console.log("Errore registrazione Service Worker:", err));
      });
    }
  </script>
</head>
<body>
  <header class="app-header">
    <div class="title-block">
      <h1>Schede & Recensioni</h1>
      <p class="subtitle">Bozze rapide e analisi</p>
    </div>
  </header>

  <main class="app-main">
    <div class="form-container">
      <!-- Formato -->
      <label>
        <span>Formato</span>
        <select id="formato">
          <option value="Cartaceo">📖 Cartaceo</option>
          <option value="Ebook / Kobo">📱 Ebook / Kobo</option>
          <option value="Audiolibro">🎧 Audiolibro</option>
        </select>
      </label>

      <!-- Stato / Cartella aggiornato -->
      <label>
        <span>Stato / Cartella</span>
        <select id="stato-libro">
          <option value="da-leggere">📚 Da leggere</option>
          <option value="in-corso">📖 In lettura</option>
          <option value="letti">✅ Letti</option>
          <option value="archivio-bozze">🗄️ Archivio bozze</option>
        </select>
      </label>

      <!-- Box Copertina e Anteprima -->
      <label>
        <span>Copertina (URL immagine)</span>
        <input type="text" id="copertina" placeholder="Incolla link immagine copertina...">
      </label>
      <div class="cover-preview-container" style="margin-top: 8px; margin-bottom: 12px;">
        <img id="img-anteprima" src="" alt="Anteprima copertina" style="max-width: 100px; display: none; border-radius: 6px;" />
      </div>

      <div class="grid-2">
        <label>
          <span>Valutazione (Stelle / Voto)</span>
          <input type="text" id="bookRating" placeholder="Es. ⭐⭐⭐⭐⭐ o 9/10">
        </label>
        <label>
          <span>Impressione / Emotività</span>
          <input type="text" id="bookMood" placeholder="Es. Intenso, riflessivo...">
        </label>
      </div>
    </div>
  </main>

  <script src="App.js"></script>
</body>
</html>
